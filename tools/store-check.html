<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיקת האחסון</title>
<style>
  :root { --bg: #111820; --card: #1a2430; --border: #334255; --text: #eef3f8; --muted: #93a4b8; --accent: #7dd3fc; --ok: #6ee7b7; --bad: #fca5a5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; line-height: 1.6; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  p.lead { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  button { background: var(--accent); color: #04121c; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 700; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 6px 0; border-bottom: 1px solid var(--border); }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>בדיקת האחסון</h1>
  <p class="lead">הבדיקה מתחברת עם חשבון הגוגל שלך, יוצרת סדרת בדיקה זמנית, בודקת עליה שמירה, מיזוג והתנגשות בין שני "מכשירים", ומוחקת אותה בסוף. שום נתון אחר לא משתנה.</p>
  <div class="card">
    <p id="who" class="muted">בודק התחברות…</p>
    <button id="signInBtn" hidden>התחברות עם גוגל</button>
    <button id="runBtn" disabled>הרצת הבדיקה</button>
  </div>
  <div class="card"><ul id="results"></ul></div>
</main>
<script src="../library-core.js"></script>
<script src="../library-store.js"></script>
<script src="../firebase-backend.js"></script>
<script>
"use strict";
(async function () {
  const $ = id => document.getElementById(id);
  const backend = FirebaseBackend.create();
  const memStorage = () => { const m = new Map(); return { getItem: k => m.get(k) ?? null, setItem: (k, v) => m.set(k, v), removeItem: k => m.delete(k) }; };
  const iso = () => new Date().toISOString();
  const E = n => ({ key: `selftest:${n}`, keys: [`selftest:${n}`], season: 1, episode: n });

  function line(ok, text) {
    const li = document.createElement("li");
    li.className = ok === null ? "muted" : (ok ? "ok" : "bad");
    li.textContent = `${ok === null ? "…" : ok ? "✓" : "✗"} ${text}`;
    $("results").appendChild(li);
  }
  function showUser() {
    const u = backend.currentUser();
    $("who").textContent = u ? `מחובר כ־${u.email}` : "לא מחובר";
    $("signInBtn").hidden = !!u;
    $("runBtn").disabled = !u;
  }

  try { await backend.ready(); } catch (e) { $("who").textContent = `טעינת השירות נכשלה: ${e.message}`; return; }
  showUser();
  $("signInBtn").onclick = async () => {
    try { await backend.signIn(); } catch (e) { $("who").textContent = `ההתחברות נכשלה: ${e.message}`; return; }
    showUser();
  };

  $("runBtn").onclick = async () => {
    $("runBtn").disabled = true;
    $("results").innerHTML = "";
    const docId = `_selftest-${Date.now()}`;
    const mk = () => LibraryStore.createLibraryStore({ core: LibraryCore, backend, storage: memStorage() });
    const A = mk(), B = mk();
    let created = false;
    try {
      line(!(await backend.canReadOtherUser()), "כללי האבטחה חוסמים גישה לנתונים של משתמש אחר");

      const t0 = performance.now();
      const loaded = await A.load();
      line(true, `טעינת הספרייה: ${loaded.size} סדרות, ${Math.round(performance.now() - t0)} מילישניות`);

      const show = LibraryCore.createShow({ ids: { imdb: "tt-selftest" }, title: "Self test", status: "plantowatch", now: Date.now() });
      const r1 = await A.apply(docId, { type: "create", show, at: iso() });
      created = r1 === "saved";
      line(created, `יצירת סדרת בדיקה: ${r1}`);

      await B.load();
      line(!!B.view().get(docId), "מכשיר שני רואה את סדרת הבדיקה");

      const rB = await B.apply(docId, { type: "setWatched", watched: true, at: iso(), episodes: [E(2)] });
      const rA = await A.apply(docId, { type: "setWatched", watched: true, at: iso(), episodes: [E(1)] });
      const fresh1 = (await backend.loadAll()).docs[docId];
      const merged = rA === "saved" && rB === "saved" && fresh1 && Object.keys(fresh1.watched).length === 2;
      line(merged, `שינויים שלא מתנגשים משני מכשירים מתמזגים (${rB}, ${rA})`);

      await B.apply(docId, { type: "setStatus", status: "dropped", at: iso() });
      const rC = await A.apply(docId, { type: "setStatus", status: "hold", at: iso() });
      const stillDropped = (await backend.loadAll()).docs[docId].status === "dropped";
      line(rC === "conflict" && stillDropped, `התנגשות אמיתית נעצרת בלי לדרוס (${rC})`);
      const rRes = await A.resolveConflict("theirs");
      line(rRes === "dropped" && A.view().get(docId).status === "dropped", "ההכרעה בהתנגשות עובדת");

      const rD = await A.apply(docId, { type: "remove" });
      const gone = !((await backend.loadAll()).docs[docId]);
      created = !gone;
      line(rD === "saved" && gone, `מחיקת סדרת הבדיקה: ${rD}`);
      line(true, "הבדיקה הסתיימה");
    } catch (e) {
      line(false, `שגיאה: ${e.message}`);
    } finally {
      if (created) {
        try { await backend.transact(docId, () => ({ write: null })); line(null, "סדרת הבדיקה נמחקה בניקוי"); } catch (e) { line(false, `ניקוי נכשל: ${e.message}`); }
      }
      $("runBtn").disabled = false;
    }
  };
})();
</script>
</body>
</html>
