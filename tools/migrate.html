<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיקה מקדימה למעבר מסימקל</title>
<style>
  :root { --bg: #111820; --card: #1a2430; --border: #334255; --text: #eef3f8; --muted: #93a4b8; --accent: #7dd3fc; --ok: #6ee7b7; --warn: #fbbf24; --bad: #fca5a5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; line-height: 1.5; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  h2 { font-size: 1.15rem; margin: 28px 0 10px; }
  p.lead { color: var(--muted); margin: 0 0 18px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  button { background: var(--accent); color: #04121c; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 700; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  #progress { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .stat { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .stat .n { font-size: 1.4rem; font-weight: 700; }
  .stat .l { color: var(--muted); font-size: .85rem; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { text-align: start; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td.ltr { direction: ltr; text-align: left; unicode-bidi: isolate; }
  ul.issues { margin: 0; padding-inline-start: 18px; }
  .error { color: var(--bad); white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>בדיקה מקדימה למעבר מסימקל</h1>
  <p class="lead">הכלי רק קורא נתונים מסימקל ומשני מקורות הפרקים. הוא לא כותב דבר לשום מקום ולא משנה את האתר או את החשבון שלך.
    כדי שיעבוד, צריך לפתוח אותו באותו שרת מקומי שבו האתר פועל ומחובר.</p>

  <div class="card">
    <div class="row">
      <button id="runBtn">הרצת הבדיקה</button>
      <button id="backupBtn" class="secondary" disabled>הורדת גיבוי מלא מסימקל</button>
      <button id="reportBtn" class="secondary" disabled>הורדת הדוח</button>
    </div>
    <p id="progress"></p>
    <p id="error" class="error"></p>
  </div>

  <div id="report"></div>
</main>
<script src="../library-core.js"></script>
<script src="../episode-source.js"></script>
<script src="migrate.js"></script>
</body>
</html>
