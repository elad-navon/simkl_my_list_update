<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>השוואת סימקל מול הספרייה</title>
<style>
  :root { --bg: #111820; --card: #1a2430; --border: #334255; --text: #eef3f8; --muted: #93a4b8; --accent: #7dd3fc; --ok: #6ee7b7; --warn: #fbbf24; --bad: #fca5a5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; line-height: 1.5; }
  main { max-width: 1250px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  h2 { font-size: 1.1rem; margin: 22px 0 8px; }
  p.lead { color: var(--muted); margin: 0 0 18px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  button { background: var(--accent); color: #04121c; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 700; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .muted { color: var(--muted); } .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { text-align: start; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .ltr { direction: ltr; unicode-bidi: isolate; }
  .frames { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .frame-box { height: 470px; overflow: hidden; border: 1px solid var(--border); border-radius: 8px; position: relative; }
  .frame-box iframe { width: 1600px; height: 1000px; border: 0; transform: scale(.37); transform-origin: top right; position: absolute; top: 0; right: 0; }
  .frame-box .label { position: absolute; bottom: 6px; right: 8px; background: var(--card); padding: 2px 8px; border-radius: 6px; font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>השוואת סימקל מול הספרייה</h1>
  <p class="lead">הכלי טוען את האתר פעמיים, פעם מסימקל ופעם מהספרייה החדשה, על הנתונים האמיתיים שלך, ומשווה את כל הקוביות.
    הוא רק קורא. צריך לפתוח אותו באותו שרת מקומי שבו האתר פועל, מחובר לסימקל ולחשבון הגוגל.
    הטעינה הראשונה מהספרייה לוקחת בערך דקה וחצי.</p>
  <div class="card">
    <button id="runBtn">הרצת ההשוואה</button>
    <p id="progress" class="muted"></p>
  </div>
  <div id="result"></div>
  <div class="frames" id="frames"></div>
</main>
<script src="compare.js"></script>
</body>
</html>
