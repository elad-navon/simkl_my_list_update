<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>compare modes harness</title>
<style>body { margin: 0; } iframe { width: 1600px; height: 1000px; border: 0; display: block; }</style>
</head>
<body>
<!-- Loads the real page (index.html + app.js) against a fake world
     (compare-modes.fake.js: fake TMDB / TVMaze / SIMKL answers and an
     in-memory database in place of Firebase), with its clock fixed, and
     checks what it puts on the panels against tests/golden/panels.json -
     the panels the SIMKL-backed site showed for the same world before
     SIMKL's code was removed. Needs a local web server at the project root.
     ?scenario=writes|ui|bridge: the changes, the screens around the panels,
     the SIMKL auto-marking (also onair, airtimes, posters - see each run*).
     ?panels=poster: the bottom panels with posters. ?show=library: just the page, full size, for a
     screenshot. ?golden=library: what the page shows (to refresh the file). -->
<pre id="result"></pre>
<script>
"use strict";
// The fake world's "now": fixed, so every run (and the expected panels in
// tests/golden/panels.json) sees exactly the same dates. ?base=<ms> moves it.
const GOLDEN_BASE = 1791795600000; // 2026-10-12 09:00 UTC
const BASE = Number(new URLSearchParams(location.search).get("base")) || GOLDEN_BASE;
const params = new URLSearchParams(location.search);

function deleteIdb(name) {
  return new Promise(resolve => {
    const req = indexedDB.deleteDatabase(name);
    req.onsuccess = req.onerror = req.onblocked = () => resolve();
    setTimeout(resolve, 2000); // some headless runs never answer
  });
}

function step(text) {
  const out = document.getElementById("result");
  if (out && !out.dataset.done) out.textContent = `step: ${text}`;
}

async function loadMode(mode, forScreenshot, scenario, panels = params.get("panels")) {
  step(`${mode}: clearing storage`);
  localStorage.clear();
  await deleteIdb("tv-library-cache");
  step(`${mode}: fetching the page`);
  const html = await (await fetch("../index.html", { cache: "no-store" })).text();
  const inject = `<base href="${new URL("../", location.href)}">` +
    `<script>window.__MODE=${JSON.stringify(mode)};window.__BASE=${BASE};window.__SCENARIO=${JSON.stringify(scenario || "")};<\/script>` +
    // The page's clock runs from BASE, not from today.
    `<script>(function () { const R = Date, off = ${BASE} - R.now();
      function D(...a) { if (!new.target) return new R(R.now() + off).toString(); return a.length ? new R(...a) : new R(R.now() + off); }
      D.prototype = R.prototype; D.now = () => R.now() + off; D.parse = R.parse; D.UTC = R.UTC; window.Date = D; })();<\/script>` +
    `<script src="tests/compare-modes.fake.js"><\/script>` +
    // ?panels=poster: the bottom panels with posters (Panels to Posters).
    (panels ? `<script>localStorage.setItem("panel_image_mode", ${JSON.stringify(panels)});<\/script>` : "") +
    (forScreenshot ? `<style>#topbarClock, #subtitle, .series-panel-updated { visibility: hidden !important; }</style>` : "");
  const doc = html
    .replace("<head>", "<head>" + inject)
    .replace('<script src="firebase-backend.js"><\/script>', '$&<script>FirebaseBackend.create = window.__fakeFirebaseCreate;<\/script>');
  const frame = document.createElement("iframe");
  frame.srcdoc = doc;
  document.body.appendChild(frame);
  step(`${mode}: loading`);
  const w = await new Promise(resolve => frame.onload = () => resolve(frame.contentWindow));
  for (let i = 0; i < 600; i++) {
    step(`${mode}: waiting (${w.document.getElementById("subtitle").textContent})`);
    const sub = w.document.getElementById("subtitle").textContent;
    if (w.document.querySelector(".series-panel-updated") || /^Error|^Nothing|required/.test(sub)) break;
    await new Promise(r => setTimeout(r, 100));
  }
  return { frame, w };
}

function collect(w) {
  const g = name => w.eval(name);
  const pick = (rows, fields) => (rows || []).map(r => Object.fromEntries(fields.map(f => [f, r[f] === undefined ? null : r[f]])));
  return {
    subtitle: w.document.getElementById("subtitle").textContent.replace(/^Updated .*/, "Updated"),
    error: (w.document.querySelector(".error-box") || {}).textContent || "",
    myList: pick(g("lastRows"), ["index", "title", "nextLabel", "episodeTitle", "nextAirDate", "badge", "totalEpisodes", "available", "watched", "remaining", "hours", "mins", "nextHours", "nextMins", "lastWatchedAt", "yearRangeLabel", "network"]),
    episodesLeft: (g("lastRows") || []).map(r => (r.episodesLeft || []).map(e => `${e.season}x${e.episode} ${e.title} ${e.runtime} ${e.badge}`)),
    totals: [g("lastTotalEps"), g("lastTotalMinutes")],
    recentlyWatched: pick(g("lastRecentlyWatched"), ["title", "season", "episode", "watchedAt", "badge", "episodeTitle", "network"]),
    planToWatch: pick(g("lastPlanToWatch"), ["title", "airedLabel", "airedTone", "ended", "yearRangeLabel", "watchedCount", "firstAirDate"]),
    airingNext: pick(g("airingRows"), ["index", "title", "nextLabel", "nextEpisodeTitle", "nextSeason", "badge", "airDate", "airDateLabel", "airDateLongLabel"]),
    // Without the airing countdowns added later (they change by the minute).
    pageText: (() => {
      const hidden = [...w.document.querySelectorAll("#app .air-count")].filter(e => !e.hidden);
      hidden.forEach(e => { e.hidden = true; });
      const text = w.document.getElementById("app").innerText;
      hidden.forEach(e => { e.hidden = false; });
      return text.replace(/Updated [^\n]*/g, "Updated");
    })(),
    simklCalls: w.__calls.filter(c => c.startsWith("api.simkl.com")).length,
    tvmazeCalls: w.__calls.filter(c => c.startsWith("api.tvmaze.com")).length,
    saveStatusVisible: !!(w.document.getElementById("saveStatus") && !w.document.getElementById("saveStatus").hidden),
  };
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function waitFor(fn, ms = 30000) {
  for (let t = 0; t < ms; t += 100) {
    try { if (fn()) return true; } catch (e) { /* not there yet */ }
    await sleep(100);
  }
  return false;
}
// Runs an action that ends in a page refresh (main()) and waits for it.
async function rerender(w, action) {
  const marker = w.document.querySelector(".series-panel-updated");
  if (marker) marker.dataset.old = "1";
  await action();
  return waitFor(() => { const m = w.document.querySelector(".series-panel-updated"); return m && !m.dataset.old; });
}

// ?scenario=writes: every kind of change, through the page's own functions,
// in library mode - checked against the (fake) database afterwards.
async function runWrites() {
  const { w } = await loadMode("library", false, "writes");
  const results = [];
  const check = (name, ok, detail) => results.push({ name, ok: !!ok, detail: detail === undefined ? null : detail });
  const lib = () => w.eval("library");
  const doc = id => lib().backend.docs.get(id);
  const row = title => (w.eval("lastRows") || []).find(r => r.title === title);
  const toast = () => w.document.getElementById("toast").textContent;
  const saveStatus = () => { const el = w.document.getElementById("saveStatus"); return el && !el.hidden ? el.textContent : ""; };
  const watchedCodes = id => Object.values(doc(id).watched).map(r => `${r.s}x${r.e}`).sort();
  const fn = name => w.eval(name);

  // A Plan to Watch show that premiered 2 days ago moves to Watching on load.
  await waitFor(() => doc("109").status === "watching" && row("Juliet"));
  check("premiere moved to Watching, mark saved on the show", doc("109").status === "watching" && /^\d{4}-\d\d-\d\d$/.test(doc("109").autoStarted), doc("109").autoStarted);

  await rerender(w, () => fn("markNextEpisodeWatched")(row("Alpha")));
  check("mark next episode watched", watchedCodes("101").includes("2x2") && row("Alpha").nextLabel === "S02E03", { toast: toast(), next: row("Alpha").nextLabel });

  await rerender(w, () => fn("changeShowStatus")(row("Charlie"), "hold"));
  check("change status", doc("103").status === "hold" && !row("Charlie"), toast());

  await rerender(w, () => fn("changeShowStatus")(row("Juliet"), "plantowatch"));
  await sleep(1500);
  check("sent back to Plan to Watch by hand stays there", doc("109").status === "plantowatch" && doc("109").autoStarted === "manual", doc("109").autoStarted);

  await fn("setEpisodesWatched")("103", 1, [6, 7], true);
  const afterAdd = watchedCodes("103");
  await fn("setEpisodesWatched")("103", 1, [7], false);
  check("episodes manager: mark and un-mark", afterAdd.includes("1x6") && afterAdd.includes("1x7") && watchedCodes("103").includes("1x6") && !watchedCodes("103").includes("1x7"), watchedCodes("103"));

  await fn("saveShowStatus")({ tmdb: 110 }, "plantowatch", { title: "אינדיה", year: "2020" });
  const added = doc("110");
  check("add from search: English title and outside ids from TMDB", added && added.title === "India" && added.ids.imdb === "tt110" && added.ids.tvdb === 9110 && added.status === "plantowatch", added && { title: added.title, ids: added.ids });

  w.confirm = () => true;
  await rerender(w, () => fn("removeShowFromMyList")(row("Alpha")));
  check("remove", !doc("101") && !row("Alpha"), toast());

  lib().backend.setOffline(true);
  await rerender(w, () => fn("changeShowStatus")(row("Hotel"), "completed"));
  check("offline: not reported as saved, shown as waiting", /back online/.test(toast()) && /Offline/.test(saveStatus()) && doc("108").status === "watching" && !row("Hotel"), { toast: toast(), saveStatus: saveStatus() });
  lib().backend.setOffline(false);
  w.dispatchEvent(new Event("online"));
  await waitFor(() => doc("108").status === "completed" && !saveStatus());
  await sleep(500);
  check("back online: the waiting change is saved", doc("108").status === "completed" && !saveStatus(), toast());

  const otherDevice = (id, status) => lib().backend.docs.set(id, w.LibraryCore.applyOp(doc(id), { id: `other-${status}`, type: "setStatus", status, at: new Date().toISOString() }).show);
  const bravo = { showId: "102", tmdbId: 102, imdbId: "tt102", title: "Bravo" };
  otherDevice("102", "dropped");
  w.confirm = () => false; // keep the other device's version
  await fn("changeShowStatus")(bravo, "hold");
  const conflictToast = toast();
  await waitFor(() => /other device's version/.test(toast()));
  check("conflict: nothing overwritten, other version kept", /another device/.test(conflictToast) && doc("102").status === "dropped" && lib().store.status().state !== "conflict", { conflictToast, after: toast() });

  otherDevice("102", "watching");
  w.confirm = () => true; // apply mine on top
  await fn("changeShowStatus")(bravo, "completed");
  await waitFor(() => /Your change was saved/.test(toast()));
  check("conflict: my change applied on top when chosen", doc("102").status === "completed", toast());

  // Only the auto-marking bridge's reads ("anything new?") may reach SIMKL.
  const bridgeReads = /^api\.simkl\.com\/(sync\/activities|sync\/all-items\/shows|tv\/episodes\/\d+)$/;
  const other = w.__calls.filter(c => c.startsWith("api.simkl.com") && !bridgeReads.test(c));
  check("nothing reaches SIMKL except the auto-marking's reads", !other.length, other);
  return results;
}

// ?scenario=ui: the screens around the panels, in library mode.
async function runUi() {
  const { w } = await loadMode("library", false, "ui");
  const results = [];
  const check = (name, ok, detail) => results.push({ name, ok: !!ok, detail: detail === undefined ? null : detail });
  const $ = sel => w.document.querySelector(sel);
  const fn = name => w.eval(name);

  fn("openSearchModal")();
  const input = $("#searchQueryInput");
  input.value = "alpha";
  input.dispatchEvent(new w.Event("input"));
  await waitFor(() => $(".search-result-row"));
  const titles = [...w.document.querySelectorAll(".search-result-title")].map(e => e.textContent);
  check("search: TMDB results, each show once", titles.length === 1 && titles[0] === "Alpha", titles);

  $(".search-result-row").click();
  await waitFor(() => $("#detailEpisodesBtn"));
  const status = $("#detailEpisodesBtn") && $("#detailEpisodesBtn").textContent.trim();
  check("show page: status and progress from the library", /Watching.*11\/18 episodes watched/.test(status), status);

  $("#detailEpisodesBtn").click();
  await waitFor(() => $(".ep-manage-summary"));
  const summary = $(".ep-manage-summary").textContent;
  const openSeason = [...w.document.querySelectorAll(".ep-card")].map(c => c.textContent.replace(/\s+/g, " ").trim());
  check("episodes manager: counts, next episode, not-aired episodes", /11\/18 episodes watched/.test(summary)
    && openSeason.some(t => /S02E02 · UP NEXT/.test(t)) && openSeason.some(t => /S02E04 · NOT AIRED/.test(t)), { summary, openSeason: openSeason.slice(0, 5) });
  // A season no source dates (Oscar's first), all watched: complete, markable.
  w.confirm = () => true;
  fn("openShowDetail")({ title: "Oscar", year: "", ids: { tmdb: 114 } });
  await waitFor(() => $("#detailEpisodesBtn") && /Oscar/.test($("#modalTitle").textContent));
  $("#detailEpisodesBtn").click();
  await waitFor(() => $('[data-season-cb="1"]'));
  const s1 = $('[data-season-cb="1"]');
  check("episodes manager: an undated, fully watched season counts as complete",
    s1.classList.contains("all") && !s1.disabled, { className: s1.className, disabled: s1.disabled });
  fn("closeSearchModal")();

  // The cast window's Episodes tab: the same manager, marking and saving there.
  // (A moment first: closing the search window steps browser history back,
  // and that lands asynchronously - a window opened before it would close.)
  await sleep(500);
  const alphaIdx = w.eval("lastRows").findIndex(r => r.title === "Alpha");
  try { await fn("openCastModal")("main", alphaIdx); }
  catch (e) { check("cast window: opens", false, String(e && e.stack || e)); return results; }
  await waitFor(() => $("#castModalOverlay .modal-tab[data-tab='episodes']"));
  $("#castModalOverlay .modal-tab[data-tab='episodes']").click();
  await waitFor(() => $("#castEpisodes .ep-manage-summary"));
  const epSummary = $("#castEpisodes .ep-manage-summary");
  check("cast window: Episodes tab shows the show's episodes",
    epSummary && /11\/18 episodes watched/.test(epSummary.textContent) && $("#castGrid").hidden,
    epSummary ? epSummary.textContent : { tab: ($("#castEpisodes") || {}).innerHTML, overlay: !!$("#castModalOverlay"), alphaIdx, cache: !!w.eval("sharedCache"), view: w.eval("currentView"), row: JSON.stringify(Object.keys((w.eval("lastRows") || [])[alphaIdx] || {})) });
  if (!epSummary) return results;
  $("#castEpisodes [data-toggle-ep='2']").click();
  let asked = 0;
  w.confirm = () => { asked++; return false; }; // keep the unsaved change
  fn("closeCastModal")();
  check("cast window: closing with an unsaved change asks first, and stays open", asked === 1 && !!$("#castModalOverlay"));
  $("#castEpisodes #epSaveBtn").click();
  const alphaDoc = () => w.eval("library").backend.docs.get("101");
  await waitFor(() => Object.values(alphaDoc().watched).some(r => r.s === 2 && r.e === 2) && !$("#castEpisodes #epSaveBtn"));
  w.confirm = () => true;
  const marker = w.document.querySelector(".series-panel-updated");
  if (marker) marker.dataset.old = "1";
  fn("closeCastModal")();
  await waitFor(() => { const m = w.document.querySelector(".series-panel-updated"); return m && !m.dataset.old; });
  const alphaRow = w.eval("lastRows").find(r => r.title === "Alpha");
  check("cast window: saved there, and the panels refresh on close",
    !$("#castModalOverlay") && alphaRow && alphaRow.nextLabel === "S02E03", alphaRow && alphaRow.nextLabel);

  fn("showSettings")(fn("main"));
  await waitFor(() => $("#libraryBackupBtn"));
  const settingsText = $(".library-settings") && $(".library-settings").textContent;
  check("settings: account, backup, restore, sign out", /signed in as test@example.com/.test(settingsText)
    && $("#libraryRestoreBtn") && $("#librarySignOutBtn"), settingsText && settingsText.replace(/\s+/g, " ").trim());
  const backup = w.eval("library").store.exportBackup();
  check("backup holds every show", backup.kind === "tv-library-backup" && Object.keys(backup.shows).length === 12, Object.keys(backup.shows).length);

  // Clean up Watching: suggests only Papa (ended, all watched) and Quebec
  // (episodes left, untouched for two years); Move applies them.
  $("#libraryCleanupBtn").click();
  await waitFor(() => $(".cleanup-row") || /Nothing to clean up/.test(w.document.getElementById("app").textContent));
  const suggestions = [...w.document.querySelectorAll(".cleanup-row")].map(r => ({
    title: r.querySelector(".cleanup-title").textContent, to: r.querySelector("select").value, why: r.querySelector(".cleanup-reason").textContent,
  }));
  // (Romeo, fully watched but still running, is left alone.)
  check("clean-up: suggests only the shows that no longer belong in Watching",
    suggestions.length === 2 && suggestions[0].title === "Papa" && suggestions[0].to === "completed"
      && suggestions[1].title === "Quebec" && suggestions[1].to === "hold", suggestions);
  const doc = id => w.eval("library").backend.docs.get(id);
  $("#cleanupMoveBtn").click();
  await waitFor(() => doc("115").status === "completed" && doc("116").status === "hold" && w.document.querySelector(".series-panel-updated"));
  check("clean-up: Move applies the choices", doc("115").status === "completed" && doc("116").status === "hold" && doc("101").status === "watching",
    { papa: doc("115").status, quebec: doc("116").status, alpha: doc("101").status });
  fn("showSettings")(fn("main"));
  await waitFor(() => $("#librarySignOutBtn"));

  $("#librarySignOutBtn").click();
  await waitFor(() => $("#librarySignInBtn"));
  check("signed out: the sign-in screen", !!$("#librarySignInBtn") && w.document.getElementById("subtitle").textContent === "Sign in required");
  $("#librarySignInBtn").click();
  const back = await waitFor(() => w.document.querySelector(".series-panel-updated"));
  check("signed in again: the panels", back);
  return results;
}

// ?scenario=bridge: SIMKL auto-marking, end to end in library mode.
async function runBridge() {
  const { w } = await loadMode("library", false, "bridge");
  const results = [];
  const check = (name, ok, detail) => results.push({ name, ok: !!ok, detail: detail === undefined ? null : detail });
  const doc = id => w.eval("library").backend.docs.get(id);
  const row = title => (w.eval("lastRows") || []).find(r => r.title === title);
  await waitFor(() => row("Alpha") && row("Alpha").nextLabel === "S02E03");
  const rec = Object.values(doc("101").watched).find(r => r.s === 2 && r.e === 2);
  check("episode marked on SIMKL lands in the library with its watch time", rec && rec.at === new Date(BASE - 3600000).toISOString(), rec);
  check("the page refreshed on its own: next episode moved on", row("Alpha").nextLabel === "S02E03", row("Alpha").nextLabel);
  check("told the user", /From SIMKL: 1 episode marked watched/.test(w.document.getElementById("toast").textContent), w.document.getElementById("toast").textContent);
  check("read point saved in the library", w.eval("library").backend.meta.get("simklBridge").since === new Date(BASE).toISOString());
  const writes = w.__calls.filter(c => c.startsWith("api.simkl.com/sync/history") || c.startsWith("api.simkl.com/sync/add"));
  check("nothing written to SIMKL", !writes.length, writes);
  return results;
}

// ?scenario=onair: the countdowns and NOW in Airing Next; an episode on the
// air stays out of My List until it ends; the quiet refreshes as an episode
// starts and as one ends.
async function runOnAir() {
  const { w } = await loadMode("library", false, "onair");
  const results = [];
  const check = (name, ok, detail) => results.push({ name, ok: !!ok, detail: detail === undefined ? null : detail });
  const doc = w.document;
  const airing = () => [...doc.querySelectorAll(".list-panel--airing .list-row")].map(r => ({
    title: r.querySelector(".list-row-title").textContent.trim(),
    count: (r.querySelector(".air-count:not([hidden])") || { innerText: "" }).innerText.replace(/\s+/g, " ").trim(),
  }));
  const card = t => [...doc.querySelectorAll(".carousel-card")].find(c => c.querySelector("h3").textContent.trim() === t);
  const airRow = t => airing().find(r => r.title === t) || {};
  await waitFor(() => airing().length);
  const a = airing();
  check("airing now: first in Airing Next, with NOW and its end time", a[0].title === "Kilo" && /^NOW ends \d\d:\d\d$/i.test(airRow("Kilo").count), a.slice(0, 3));
  check("starting in under a minute: 1 MIN", airRow("Lima").count === "1 MIN", airRow("Lima"));
  check("in 5h 20m: 6 HOURS (rounded up)", airRow("Mike").count === "6 HOURS", airRow("Mike"));
  check("33 hours away: in hours", airRow("Bravo").count === "33 HOURS", airRow("Bravo"));
  check("more than 48 hours away: in days", /^\d+ DAYS$/.test(airRow("Delta").count), airRow("Delta"));
  check("while it airs, the episode isn't in My List", !card("Kilo"), "Kilo not in My List");
  check("no ON AIR ribbon anywhere", ![...doc.querySelectorAll(".card-ribbon")].some(r => /ON AIR/.test(r.textContent)));
  const started = await waitFor(() => /^NOW/.test(airRow("Lima").count || ""), 90000);
  check("as an episode starts: NOW in Airing Next, still not in My List", started && !card("Lima"), { airing: airRow("Lima"), inMyList: !!card("Lima") });
  const ended = await waitFor(() => !!card("Kilo"), 90000);
  check("as an episode ends, the page refreshes by itself: in My List, no longer NOW",
    ended && !/^NOW/.test(airRow("Kilo").count || ""),
    { inMyList: !!card("Kilo"), next: card("Kilo") && card("Kilo").querySelector(".next-up").textContent, airing: airRow("Kilo") });
  const order = () => [...doc.querySelectorAll(".carousel-card h3")].map(h => h.textContent.trim());
  check("the show whose episode just ended comes first in My List", order()[0] === "Kilo", order());
  const limaIn = await waitFor(() => order()[0] === "Lima", 120000);
  check("the next one to end takes first place, the previous moves one along",
    limaIn && order()[1] === "Kilo", order());
  check("no loading screen during those refreshes", !doc.querySelector("#app .spinner, #app .film-loader"));
  return results;
}

// ?scenario=airtimes: SIMKL's air times for episodes TVMaze lists by date
// only - taken only when real and on the known date.
async function runAirTimes() {
  const { w } = await loadMode("library", false, "airtimes");
  const results = [];
  const check = (name, ok, detail) => results.push({ name, ok: !!ok, detail: detail === undefined ? null : detail });
  const doc = w.document;
  const airing = () => [...doc.querySelectorAll(".list-panel--airing .list-row")].map(r => ({
    title: r.querySelector(".list-row-title").textContent.trim(),
    count: (r.querySelector(".air-count:not([hidden])") || { innerText: "" }).innerText.replace(/\s+/g, " ").trim(),
  }));
  const airRow = t => airing().find(r => r.title === t) || {};
  await waitFor(() => airing().length);
  check("SIMKL's real time is taken: hours, not TODAY", airRow("November").count === "3 HOURS", airRow("November"));
  check("SIMKL's midnight is no time: still TODAY", airRow("Sierra").count === "TODAY", airRow("Sierra"));
  check("SIMKL's date two days off: the known date stays", airRow("Tango").count === "1 DAY", airRow("Tango"));
  const order = airing().map(r => r.title);
  check("the timed episode sorts before today's date-only one", order.indexOf("November") < order.indexOf("Sierra"), order);
  const asked = w.__calls.filter(c => c.startsWith("api.simkl.com/tv/episodes/")).sort();
  check("SIMKL asked only about shows with a date-only episode coming up",
    JSON.stringify(asked) === JSON.stringify(["api.simkl.com/tv/episodes/28", "api.simkl.com/tv/episodes/29", "api.simkl.com/tv/episodes/30"]), asked);
  // A refresh: the lists come from the cache, SIMKL isn't asked again.
  await rerender(w, () => w.eval("main")());
  const askedAgain = w.__calls.filter(c => c.startsWith("api.simkl.com/tv/episodes/")).length;
  check("a refresh doesn't ask SIMKL again", askedAgain === 3 && airRow("November").count === "3 HOURS", { askedAgain, november: airRow("November") });
  return results;
}

// ?scenario=posters: Panels to Posters - the bottom panels keep their size,
// the shows in L-shaped pairs drawn like the top panel's, and the button
// switches back and forth.
async function runPosters() {
  const results = [];
  const check = (name, ok, detail) => results.push({ name, ok: !!ok, detail: detail === undefined ? null : detail });
  const measure = w => {
    const doc = w.document;
    const panel = sel => doc.querySelector(sel).getBoundingClientRect();
    const range = sel => doc.querySelector(`${sel} .list-pager-range`).textContent.trim();
    const shown = sel => {
      const track = doc.querySelector(`${sel} .list-rows-paged`).getBoundingClientRect();
      return [...doc.querySelectorAll(`${sel} .list-row`)].filter(r => { const b = r.getBoundingClientRect(); return b.left >= track.left - 1 && b.right <= track.right + 1; }).length;
    };
    const out = {};
    for (const [k, sel] of [["watched", ".list-panel--watched"], ["airing", ".list-panel--airing"], ["plan", ".list-panel--plan"]]) {
      const b = panel(sel);
      out[k] = { w: Math.round(b.width), h: Math.round(b.height), range: range(sel), shown: shown(sel) };
    }
    const bar = doc.querySelector(".topbar").getBoundingClientRect();
    out.topbarH = Math.round(bar.height);
    const thumb = doc.querySelector(".list-panel--watched .list-thumb-wrap").getBoundingClientRect();
    out.thumb = [Math.round(thumb.width), Math.round(thumb.height)];
    out.pairs = doc.querySelectorAll(".bottom-panels-row .panel-pair").length;
    out.order = [...doc.querySelectorAll(".bottom-panels-row .list-panel")].map(p => p.className.replace("list-panel list-panel--", ""));
    const frame = el => el && getComputedStyle(el).borderTopColor;
    out.frames = [frame(doc.querySelector(".panel-pair > .list-row:nth-child(1) .list-thumb-wrap")), frame(doc.querySelector(".panel-pair > .list-row:nth-child(2) .list-row-body"))];
    const top = [frame(doc.querySelector(".poster-pair > .card:nth-child(1) .poster-wrap")), frame(doc.querySelector(".poster-pair > .card:nth-child(2) .card-body"))];
    out.topFrames = top;
    return out;
  };
  const banner = await loadMode("library", false, "", "banner");
  const before = measure(banner.w);
  banner.frame.remove();
  const poster = await loadMode("library", false, "", "poster");
  const after = measure(poster.w);
  const same = k => before[k].w === after[k].w && before[k].h === after[k].h;
  check("the panels keep their size", same("watched") && same("airing") && same("plan"), { before, after });
  check("the top bar keeps its height", before.topbarH === after.topbarH, [before.topbarH, after.topbarH]);
  check("Airing Next first, then Plan to Watch and Recently Watched", JSON.stringify(after.order) === JSON.stringify(["airing", "plan", "watched"]), after.order);
  check("a poster, as tall as the two banners", after.thumb[0] === 187 && after.thumb[1] === 280, after.thumb);
  check("the shows in pairs, a page per pair", after.pairs >= 3 && /^1 of /.test(after.watched.range) && /^1-2 of /.test(after.airing.range), after);
  check("the same frame colors as the top panel's pairs", after.frames[0] === "rgb(48, 156, 205)" && after.frames[1] === "rgb(203, 156, 35)", after.frames);
  // The narrow panels' arrows step one show at a time: the pair's second
  // show stops where its details box starts, the next pair at its start.
  const w = poster.w;
  const panelEl = w.document.querySelector(".list-panel--watched");
  const track = panelEl.querySelector(".list-rows-paged");
  const rangeNow = () => panelEl.querySelector(".list-pager-range").textContent.trim();
  const at = el => Math.round(el.getBoundingClientRect().left - track.getBoundingClientRect().left);
  // Headless runs neither animate a smooth scroll nor run animation frames:
  // the scroll lands at once and the header is brought up to date directly.
  track.scrollTo = o => { track.scrollLeft = o.left; w.eval("updatePagerUiForTrack")(track); };
  const steps = [rangeNow()];
  const lefts = [];
  for (let i = 0; i < 2; i++) {
    panelEl.querySelector(".list-pager-arrow.next").click();
    await sleep(900);
    steps.push(rangeNow());
  }
  const second = track.querySelectorAll(".list-row")[2];
  lefts.push(at(second.querySelector(".list-thumb-wrap")));
  panelEl.querySelector(".list-pager-arrow.prev").click();
  await sleep(900);
  const body2 = track.querySelectorAll(".list-row")[1].querySelector(".list-row-body");
  lefts.push(at(body2));
  check("narrow panels: each arrow click moves one show (poster + its details)",
    /^1 of /.test(steps[0]) && /^2 of /.test(steps[1]) && /^3 of /.test(steps[2]) && Math.abs(lefts[0]) <= 1 && Math.abs(lefts[1]) <= 1,
    { steps, lefts });
  const btn = () => w.document.getElementById("panelImagesBtn");
  check("the button offers the way back", /Panels to\s*Banners/.test(btn().textContent), btn().textContent);
  await rerender(w, () => btn().click());
  const back = measure(w);
  check("one click: banners again, two per page", back.watched.shown === 2 && /^1-2 of /.test(back.watched.range) &&
    back.thumb[0] === 204 && !back.pairs && /Panels to\s*Posters/.test(btn().textContent), back);
  return results;
}

// ?scenario=nowwatching: what Emby is playing (meta "emby", faked) on the
// top cards - a WATCHING ribbon and the minutes on the playing show's
// card, PAUSED on the one stopped partway, the other ribbons untouched.
async function runNowWatching() {
  const { w } = await loadMode("library", false, "nowwatching");
  const results = [];
  const check = (name, ok, detail) => results.push({ name, ok: !!ok, detail: detail === undefined ? null : detail });
  const doc = w.document;
  const card = t => [...doc.querySelectorAll(".carousel-card")].find(c => c.querySelector("h3").textContent.trim() === t);
  await waitFor(() => doc.querySelector(".card-ribbon.tone-watching"));
  const alpha = card("Alpha"), charlie = card("Charlie"), hotel = card("Hotel");
  check("playing: WATCHING ribbon and the minutes on its card",
    alpha.querySelector(".card-ribbon.tone-watching") && alpha.querySelector(".nw-time").textContent.trim() === "23 / 45 min",
    alpha.querySelector(".nw-time") && alpha.querySelector(".nw-time").textContent);
  check("stopped partway: PAUSED, its bar where it stopped",
    charlie.querySelector(".card-ribbon.tone-paused") && charlie.querySelector(".nw-bar i").style.width === "27%",
    charlie.querySelector(".nw-bar i") && charlie.querySelector(".nw-bar i").style.width);
  check("other cards keep their own ribbon", hotel.querySelector(".card-ribbon:not(.nw-overlay)") && !hotel.querySelector(".nw-overlay"));
  await rerender(w, () => w.eval("main")());
  await waitFor(() => doc.querySelector(".card-ribbon.tone-watching"));
  check("still there after the page redraws", !!card("Alpha").querySelector(".card-ribbon.tone-watching"));
  return results;
}

(async () => {
  const out = document.getElementById("result");
  try {
    if (params.get("scenario") === "nowwatching" && !params.get("show")) {
      const results = await runNowWatching();
      out.dataset.done = "1";
      out.textContent = JSON.stringify({ writes: results }, null, 1);
      return;
    }
    if (params.get("scenario") === "posters") {
      const results = await runPosters();
      out.dataset.done = "1";
      out.textContent = JSON.stringify({ writes: results }, null, 1);
      return;
    }
    if (params.get("scenario") === "airtimes" && !params.get("show")) {
      const results = await runAirTimes();
      out.dataset.done = "1";
      out.textContent = JSON.stringify({ writes: results }, null, 1);
      return;
    }
    if (params.get("scenario") === "onair" && !params.get("show")) {
      const results = await runOnAir();
      out.dataset.done = "1";
      out.textContent = JSON.stringify({ writes: results }, null, 1);
      return;
    }
    if (params.get("scenario") === "bridge") {
      const results = await runBridge();
      out.dataset.done = "1";
      out.textContent = JSON.stringify({ writes: results }, null, 1);
      return;
    }
    if (params.get("scenario") === "ui" && !params.get("show")) {
      const results = await runUi();
      out.dataset.done = "1";
      out.textContent = JSON.stringify({ writes: results }, null, 1);
      return;
    }
    if (params.get("scenario") === "writes") {
      const results = await runWrites();
      out.dataset.done = "1";
      out.textContent = JSON.stringify({ writes: results }, null, 1);
      return;
    }
    if (params.get("show")) {
      document.body.style.overflow = "hidden";
      out.remove();
      const { frame } = await loadMode(params.get("show"), true, params.get("scenario") || "");
      // ?w=&h=: the page at another size (e.g. a phone's 390 x 844).
      if (params.get("w")) { frame.style.width = `${params.get("w")}px`; frame.style.height = `${params.get("h") || 844}px`; }
      // ?open=loader: the loading screen, held (for a screenshot).
      if (params.get("open") === "loader") {
        const w = frame.contentWindow;
        await waitFor(() => w.document.querySelector(".series-panel-updated"));
        w.eval("app.innerHTML = filmLoaderHtml(); subtitle.textContent = 'Loading episode lists… 37/130'");
      }
      // ?open=cleanup: the Clean up Watching screen instead of the panels.
      if (params.get("open") === "cleanup") {
        const w = frame.contentWindow;
        await waitFor(() => w.document.querySelector(".series-panel-updated"));
        w.eval("showWatchingCleanup")();
      }
      // ?open=cast / cast-episodes: Alpha's cast window, on either tab.
      if (/^cast/.test(params.get("open") || "")) {
        const w = frame.contentWindow;
        await waitFor(() => w.document.querySelector(".series-panel-updated"));
        await w.eval("openCastModal")("main", w.eval("lastRows").findIndex(r => r.title === "Alpha"));
        if (params.get("open") === "cast-episodes") {
          await waitFor(() => w.document.querySelector(".modal-tab[data-tab='episodes']"));
          w.document.querySelector(".modal-tab[data-tab='episodes']").click();
        }
      }
      return;
    }
    // ?golden=<mode>: just what that mode shows (to write tests/golden/panels.json).
    if (params.get("golden")) {
      const { w } = await loadMode(params.get("golden"), false);
      out.dataset.done = "1";
      out.textContent = JSON.stringify(collect(w), null, 1);
      return;
    }
    // Default: the page (library mode) against the expected panels, taken
    // from the SIMKL-backed page on the same fake world before SIMKL's code
    // was removed.
    const golden = await (await fetch("golden/panels.json", { cache: "no-store" })).json();
    const { w } = await loadMode("library", false);
    const library = collect(w);
    const diffs = [];
    for (const key of Object.keys(golden)) {
      if (["simklCalls", "tvmazeCalls", "saveStatusVisible"].includes(key)) continue;
      if (JSON.stringify(golden[key]) !== JSON.stringify(library[key])) diffs.push(key);
    }
    out.dataset.done = "1";
    out.textContent = JSON.stringify({ diffs, results: { simkl: golden, library } }, null, 1);
  } catch (e) {
    out.dataset.done = "1";
    out.textContent = JSON.stringify({ harnessError: String(e && e.stack || e) });
  }
})();
</script>
