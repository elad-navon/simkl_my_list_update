<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My List - Continue Watching</title>
<style>
  :root {
    --bg: #020a12;
    --sidebar-bg: #020911;
    --card: #03101a;
    --card-hover: #0a1c28;
    --border: #123143;
    --text: #f5f7fa;
    --muted: #b8c0c8;
    --accent: #00e5ff;
    --accent2: #22d3ee;
    --gold: #ffd000;
    --danger: #ff6b6b;
    --divider: rgba(255,255,255,0.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; }
  body {
    display: flex;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
  }

  /* ===================== Sidebar ===================== */
  .sidebar {
    width: 235px; flex: 0 0 auto; min-height: 100vh;
    background: var(--sidebar-bg); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 28px 18px;
    position: sticky; top: 0; align-self: flex-start;
    /* The sidebar always keeps its own dark background regardless of the
       light/dark theme toggle, so pin its text colors locally too - this
       overrides --text/--muted for every var() lookup inside the sidebar,
       without needing a body.light-theme override per rule. */
    --text: #f5f7fa;
    --muted: #b8c0c8;
  }
  .navbar-logo { display: flex; align-items: flex-start; gap: 13px; padding: 0 6px 32px; }
  .logo-icon { display: flex; align-items: center; padding-top: 2px; }
  .logo-text { display: flex; flex-direction: column; line-height: 1.15; }
  .logo-text .logo-tv { font-size: 1.9rem; font-weight: 800; color: var(--text); letter-spacing: 0.5px; }
  .logo-accent {
    font-size: 0.82rem; font-weight: 700; color: var(--accent);
    letter-spacing: 0.12em; margin-top: 2px;
  }
  .version-tag {
    font-size: 0.7rem; font-weight: 600; color: var(--muted); background: var(--card);
    border: 1px solid var(--border); border-radius: 20px; padding: 3px 9px;
    margin-left: 6px; letter-spacing: 0.04em;
  }
  .navbar-nav { display: flex; flex-direction: column; gap: 12px; }
  .nav-item {
    display: flex; align-items: center; gap: 14px; position: relative;
    background: transparent; border: none; color: var(--text);
    font-size: 1rem; font-weight: 600; letter-spacing: 0.01em; text-align: left;
    padding: 14px 16px; border-radius: 10px; cursor: pointer; width: 100%;
  }
  .nav-icon { line-height: 1; display: inline-flex; flex: 0 0 auto; color: var(--muted); }
  .nav-item:hover:not(.active) { background: rgba(255,255,255,0.05); }
  .nav-item.active {
    color: var(--accent); font-weight: 700;
    background: rgba(0,229,255,0.12);
    box-shadow: inset 3px 0 0 0 var(--accent);
  }
  .nav-item.active .nav-icon { color: var(--accent); }
  .sidebar-bottom { margin-top: auto; padding: 10px 6px 0; border-top: 1px solid var(--border); }
  .dark-mode-row {
    display: flex; align-items: center; gap: 9px; padding: 14px 6px 4px;
    font-size: 0.85rem; font-weight: 600; color: var(--text);
  }
  .dark-mode-row .nav-icon { color: var(--muted); }
  .dark-mode-row span.dm-label { flex: 1 1 auto; }
  .theme-toggle {
    flex: 0 0 auto; width: 38px; height: 21px; border-radius: 20px;
    background: #223141; border: none; cursor: pointer; position: relative;
    padding: 0; transition: background 0.15s ease;
  }
  .theme-toggle::after {
    content: ""; position: absolute; top: 2.5px; left: 3px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; transition: left 0.15s ease;
  }
  .theme-toggle.on { background: var(--accent); }
  .theme-toggle.on::after { left: 19px; }

  /* ===================== Main content ===================== */
  .main-content { flex: 1 1 auto; min-width: 0; padding: 28px 40px 60px; }
  .page-header {
    margin-bottom: 22px; display: flex; align-items: baseline;
    justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .page-title {
    font-size: 2.1rem; font-weight: 800; color: var(--text); margin: 0;
    letter-spacing: 0.01em;
  }
  .page-header p { color: var(--muted); margin: 0; font-size: 0.9rem; font-weight: 600; }
  /* ===================== "MY LIST" series panel + carousel ===================== */
  .series-panel {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; max-width: 100%; margin: 0 auto;
  }
  .series-panel-header {
    display: flex; align-items: center; gap: 9px; color: var(--accent);
    font-weight: 700; font-size: 0.95rem; letter-spacing: 0.04em; margin-bottom: 16px;
  }
  .series-panel-header-left { display: flex; align-items: center; gap: 9px; }
  .series-panel-stats { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
  .series-panel-stat {
    display: flex; align-items: baseline; gap: 6px; background: var(--card-hover);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px;
  }
  .series-panel-stat .num { color: var(--gold); font-weight: 800; font-size: 1.05rem; }
  .series-panel-stat .label {
    color: var(--muted); font-size: 0.72rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .carousel-wrap { position: relative; }
  .carousel-track {
    display: flex; gap: 18px; overflow-x: auto; scroll-behavior: smooth;
    scrollbar-width: none; padding-bottom: 2px;
  }
  .carousel-track::-webkit-scrollbar { display: none; }
  .carousel-arrow {
    position: absolute; right: -14px; transform: translateY(-50%);
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border);
    background: #060f18; color: var(--text); cursor: pointer; z-index: 20;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,0,0,0.5);
  }
  .carousel-arrow:hover { background: var(--card-hover); }
  .carousel-arrow.left { right: auto; left: -14px; }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 24px; max-width: 1400px; margin: 40px auto 0;
  }
  .grid.banner-mode {
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35); transition: background 0.15s ease;
    display: flex; flex-direction: column; position: relative; overflow: hidden;
  }
  .card:hover { background: var(--card-hover); }
  .card.carousel-card { width: 225px; flex: 0 0 auto; }
  .card.carousel-card.banner-mode { width: 320px; }
  .remaining-badge {
    position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,0.72);
    color: var(--gold); font-size: 0.68rem; font-weight: 800; line-height: 1;
    padding: 5px 7px; border-radius: 5px; backdrop-filter: blur(3px); z-index: 10;
  }
  .badge {
    position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.55);
    color: var(--text); font-weight: 700; font-size: 0.85rem; padding: 4px 10px;
    border-radius: 20px; backdrop-filter: blur(3px); z-index: 10;
  }
  .cycle-btn {
    position: absolute; top: 8px; right: 8px; width: 26px; height: 26px;
    border-radius: 50%; border: none; background: rgba(0,0,0,0.55);
    color: var(--text); font-size: 0.95rem; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 10; backdrop-filter: blur(3px);
  }
  .cycle-btn:hover { background: rgba(0,0,0,0.8); }
  .cycle-btn.disabled { opacity: 0.35; cursor: default; }
  .imdb-btn {
    position: absolute; bottom: 8px; left: 8px; z-index: 10;
    border: none; background: transparent; padding: 0; margin: 0;
    cursor: pointer; line-height: 0;
    display: flex; align-items: center; gap: 4px;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.55));
    transition: transform 0.12s ease;
  }
  .imdb-btn:hover { transform: scale(1.06); }
  .imdb-btn svg { display: block; }
  .imdb-rating {
    background: rgba(0,0,0,0.7); color: var(--gold); font-weight: 800;
    font-size: 11px; padding: 2px 6px; border-radius: 4px;
    line-height: 1.3;
  }
  .poster-wrap {
    position: relative; overflow: hidden;
    transition: box-shadow 0.18s ease;
  }
  .card .poster-wrap { border-radius: 0; }
  .card:hover .poster-wrap {
    box-shadow: inset 0 0 0 2px var(--accent);
  }
  .poster { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background: #0a1c28; display: block; }
  .poster.banner-img { aspect-ratio: 16 / 9; }
  .poster.placeholder {
    display: flex; align-items: center; justify-content: center;
    font-size: 2.6rem; font-weight: 700; color: var(--muted);
  }

  /* Plain (non-link) IMDb pill - used in the Plan to Watch list rows. */
  .imdb-pill {
    background: var(--gold); color: #000; font-weight: 800; font-size: 10px;
    padding: 2px 6px; border-radius: 4px; letter-spacing: 0.02em;
  }
  .imdb-pill-rating { color: var(--gold); font-weight: 800; font-size: 0.85rem; }
  .imdb-pill-btn {
    display: inline-flex; align-items: center; gap: 6px; background: transparent;
    border: none; padding: 0; margin: 0; cursor: pointer;
  }
  .imdb-pill-btn:hover .imdb-pill { filter: brightness(1.1); }

  .card-body {
    padding: 10px 12px 11px;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    height: 126px;
    min-height: 126px;
  }
  .card-body h3 {
    margin: 0;
    padding: 0;
    font-size: 1.08rem;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -0.01em;
    height: auto;
    min-height: 0;
    max-height: 2.4em;
    overflow: hidden;
  }
  .episode-title {
    margin: 2px 0 0;
    padding: 0;
    font-size: 0.79rem;
    line-height: 1.2;
    height: auto;
    min-height: 0;
    max-height: 1.2em;
    color: var(--muted);
    font-weight: 500;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .next-up {
    margin: 2px 0 0;
    padding: 0;
    font-size: 0.82rem;
    line-height: 1.2;
    height: auto;
    min-height: 0;
    font-weight: 600;
    overflow: hidden;
    color: var(--accent2);
  }
  .time-left {
    font-size: 0.95rem;
    color: var(--gold);
    font-weight: 700;
    line-height: 1.2;
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 5px;
  }
  .time-left .time-icon { color: #ffffff; flex: 0 0 auto; display: inline-flex; }
  .air-date { margin-top: 8px; font-size: 1.05rem; color: var(--accent2); font-weight: 700;
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.16);
    
  }
  .section-note {
    text-align: center; color: var(--muted); font-size: 0.85rem;
    max-width: 700px; margin: 22px auto 0;
  }
  /* ===================== Recently Watched / Airing Next / Plan to Watch panels ===================== */
  .bottom-panels-row {
    display: flex; gap: 22px; margin: 26px auto 0; align-items: flex-start;
  }
  .bottom-panels-row .list-panel { flex: 1 1 0; min-width: 0; }
  .bottom-panels-row .list-panel--airing { flex: 1.3 1 0; }
  .list-panel {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px;
  }
  .list-panel-header {
    display: flex; align-items: center; gap: 9px; color: var(--accent);
    font-weight: 700; font-size: 0.9rem; letter-spacing: 0.06em; margin-bottom: 6px;
  }
  /* Vertical carousel - all three panels show ~5 rows before scrolling
     (5 * (76px banner thumb + 24px row padding + 1px border) = 505px). */
  .list-rows-scroll {
    max-height: 505px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    padding-right: 14px; margin-right: -14px;
  }
  .list-rows-scroll::-webkit-scrollbar { width: 6px; }
  .list-rows-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .list-row {
    display: flex; align-items: center; gap: 14px; padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .list-row:last-child { border-bottom: none; }
  .list-thumb {
    width: 134px; height: 76px; border-radius: 6px; object-fit: cover;
    background: #0a1c28; flex: 0 0 auto; display: block;
  }
  .list-thumb.placeholder {
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: 700; color: var(--muted);
  }
  .list-row-title-wrap { flex: 1 1 auto; min-width: 0; }
  .list-row-title {
    flex: 1 1 auto; min-width: 0; font-weight: 600; font-size: 0.92rem;
    color: var(--text); white-space: normal; line-height: 1.25;
    text-transform: uppercase; letter-spacing: 0.02em;
  }
  .list-row-sub { font-size: 0.74rem; color: var(--muted); font-weight: 500; margin-top: 2px; }
  .list-row-airdate { color: var(--accent2); font-weight: 700; font-size: 0.8rem; margin-top: 4px; }
  .premiere-badge {
    display: inline-block; background: #2fa84f; color: #fff; font-weight: 800;
    font-size: 0.64rem; letter-spacing: 0.04em; padding: 3px 8px; border-radius: 4px;
    text-transform: uppercase; margin-top: 5px;
  }
  .premiere-badge.finale { background: #c1502e; }
  .list-check {
    flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
    border: 1.5px solid var(--accent); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .list-imdb { margin-top: 4px; display: flex; align-items: center; }
  footer {
    display: flex; align-items: center; justify-content: space-between;
    color: var(--muted); font-size: 0.78rem; margin-top: 50px;
  }

  .center-box {
    max-width: 480px; margin: 60px auto; background: var(--card); border-radius: 14px;
    padding: 30px; text-align: center; box-shadow: 0 6px 22px rgba(0,0,0,0.35);
  }
  .center-box input {
    width: 100%; padding: 10px 12px; margin: 8px 0; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.9rem;
  }
  .center-box label { display: block; text-align: left; font-size: 0.8rem; color: var(--muted); margin-top: 10px; }
  .center-box code { background: var(--bg); padding: 2px 6px; border-radius: 4px; }
  .pin-code {
    font-size: 2rem; letter-spacing: 6px; font-weight: 700; color: var(--accent);
    margin: 16px 0; font-family: monospace;
  }
  .spinner {
    width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.9s linear infinite; margin: 18px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { color: var(--danger); font-size: 0.85rem; margin-top: 10px; white-space: pre-wrap; }
  a { color: var(--accent2); }

  .my-list-next {
    color: #67e8f9;
  }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: var(--card); color: var(--text); padding: 12px 20px; border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4); font-size: 0.9rem; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 200; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { color: var(--danger); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 20px; z-index: 150; overflow-y: auto;
  }
  .modal-box {
    width: 100%; max-width: 560px; background: var(--card); border-radius: 14px;
    padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal-box h2 { margin: 0 0 14px; display: flex; align-items: center; justify-content: space-between; font-size: 1.3rem; }
  .modal-close-btn {
    background: transparent; border: none; color: var(--muted); font-size: 1.4rem;
    cursor: pointer; line-height: 1; padding: 0 4px;
  }
  .modal-close-btn:hover { color: var(--text); }
  .search-input-row input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 0.95rem; box-sizing: border-box;
  }
  .search-results { margin-top: 16px; max-height: 55vh; overflow-y: auto; }
  .search-result-row {
    display: flex; align-items: center; gap: 12px; padding: 8px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    cursor: pointer; border-radius: 8px;
  }
  .search-result-row:hover { background: rgba(255,255,255,0.06); }
  .search-result-poster {
    width: 42px; height: 63px; border-radius: 5px; object-fit: cover;
    background: var(--card-hover); flex: 0 0 auto;
  }
  .search-result-poster.placeholder {
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; font-weight: 700; color: var(--muted);
  }
  .search-result-info { flex: 1 1 auto; min-width: 0; }
  .search-result-title { font-weight: 700; font-size: 0.95rem; }
  .search-result-year { color: var(--muted); font-size: 0.8rem; }
  .modal-back-btn {
    background: transparent; border: none; color: var(--accent2); font-size: 0.85rem;
    font-weight: 700; cursor: pointer; padding: 0 0 14px; display: block;
  }
  .modal-back-btn:hover { text-decoration: underline; }
  .detail-header { display: flex; gap: 16px; }
  .detail-poster {
    width: 90px; height: 135px; border-radius: 8px; object-fit: cover;
    background: var(--card-hover); flex: 0 0 auto;
  }
  .detail-poster.placeholder {
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; font-weight: 700; color: var(--muted);
  }
  .detail-info { flex: 1 1 auto; min-width: 0; }
  .detail-title { font-size: 1.15rem; font-weight: 800; }
  .detail-year { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  .detail-status { margin-top: 10px; font-size: 0.88rem; font-weight: 700; }
  .detail-status.not-in-list { color: var(--muted); }
  .detail-status.in-list { color: var(--accent); }
  .detail-status-picker { margin-top: 20px; }
  .detail-picker-label { color: var(--muted); font-size: 0.8rem; margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.06em; }

  .card-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
  .card-title-row h3 { flex: 1 1 auto; min-width: 0; }
  .card-menu-btn {
    flex: 0 0 auto; background: transparent; border: none; color: var(--muted);
    font-size: 1.2rem; line-height: 1; padding: 0 2px; cursor: pointer;
  }
  .card-menu-btn:hover { color: var(--text); }
  .card-menu-dropdown {
    position: fixed; background: var(--card); border-radius: 10px; min-width: 170px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45); z-index: 160; overflow: hidden; padding: 6px;
  }
  .card-menu-item {
    display: block; width: 100%; text-align: left; background: transparent; border: none;
    color: var(--text); font-size: 0.86rem; padding: 8px 10px; border-radius: 6px; cursor: pointer;
  }
  .card-menu-item:hover { background: rgba(255,255,255,0.08); }
  .card-menu-item.active { color: var(--accent); font-weight: 700; }
  .card-menu-item.danger { color: var(--danger); }
  .card-menu-item:disabled { opacity: 0.5; cursor: default; }
  .card-menu-item:disabled:hover { background: transparent; }
  .card-menu-sep { height: 1px; background: rgba(255,255,255,0.1); margin: 6px 4px; }

  /* Light theme overrides - toggled via body.light-theme */
  body.light-theme {
    --bg: #f2f3f6;
    --card: #ffffff;
    --card-hover: #eef0f4;
    --border: #dde1e8;
    --text: #16171c;
    --muted: #5c6070;
    --divider: rgba(0,0,0,0.2);
  }
  body.light-theme { background: var(--bg); }
  body.light-theme .sidebar { background: #0a0a0d; border-right-color: #0a0a0d; } /* sidebar stays dark in both themes, per the reference design */
  body.light-theme .card { box-shadow: 0 6px 18px rgba(0,0,0,0.12); }
  body.light-theme .center-box { box-shadow: 0 10px 30px rgba(0,0,0,0.10); }
</style>
</head>

    </button>

  <div class="sidebar-bottom">

      <span class="nav-icon"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></span>
      <span class="dm-label">Dark Mode</span>
      <button class="theme-toggle" id="themeToggleBtn" title="Toggle light/dark"></button>

</aside>

<main class="main-content">
  <div class="page-header">
    <h1 class="page-title" id="pageTitle">MY LIST</h1>
    <p id="subtitle">Loading&hellip;</p>
  </div>

  <div id="app"></div>
  <div id="toast" class="toast"></div>

  <footer>

  </footer>
</main>

<script>
"use strict";

// ---------------------------------------------------------------------
// Config - not hardcoded. Stored only in this browser's localStorage,
// so this HTML file itself never contains your keys (safe to commit).
// ---------------------------------------------------------------------
const SIMKL_BASE = "https://api.simkl.com";
const TMDB_BASE = "https://api.themoviedb.org/3";
const TMDB_IMAGE_BASE = "https://image.tmdb.org/t/p/w342";
const TMDB_BACKDROP_BASE = "https://image.tmdb.org/t/p/w780";
const APP_NAME = "my-list-summary-web";
const APP_VERSION = "1.0";

// ---------------------------------------------------------------------
// Nav bar icon - only this one needs to be rebuilt dynamically (its
// label text changes); the others are embedded directly in the static
// HTML above since they never change.
// ---------------------------------------------------------------------
// Poster (vertical) and banner (landscape) icons for the image-mode
// toggle - the icon shown reflects what you'll switch TO, matching
// the button's own label.
const ICON_POSTER_SHAPE = `<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"></rect></svg>`;
const ICON_BANNER_SHAPE = `<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect></svg>`;

const LS_CLIENT_ID = "simkl_client_id";
const LS_TMDB_KEY = "tmdb_api_key";
const LS_TOKEN = "simkl_access_token";
const LS_IMAGE_MODE = "simkl_image_mode"; // "poster" | "banner"
const LS_THEME = "simkl_theme"; // "light" | "dark"
const LS_VIEW_MODE = "simkl_view_mode";   // "list" or "airing" (not restored on load - always starts on "list")

const app = document.getElementById("app");
const subtitle = document.getElementById("subtitle");

function getImageMode() {
  return localStorage.getItem(LS_IMAGE_MODE) === "banner" ? "banner" : "poster";
}

function nextImageMode(mode) {
  return mode === "poster" ? "banner" : "poster";
}

function getConfig() {
  return {
    clientId: localStorage.getItem(LS_CLIENT_ID) || "",
    tmdbKey: localStorage.getItem(LS_TMDB_KEY) || "",
  };
}

// ---------------------------------------------------------------------
// Settings screen (first run, or via the Settings button)
// ---------------------------------------------------------------------
function returnToPreviousView() {
  if (currentView === "airing" && airingRows) {
    renderAiringRows(airingRows);
  } else {
    renderRows(lastRows || [], lastTotalEps, lastTotalMinutes, lastRecentlyWatched);
  }
}

function showSettings(afterSaveCallback) {
  document.getElementById("settingsBtn").classList.add("active");
  const cfg = getConfig();
  // Only offer a way back if there's actually a previously-loaded view to
  // return to - on first run (no config yet) there's nothing to cancel back
  // to, and both fields are required anyway.
  const canCancel = lastRows !== null || airingRows !== null;
  const closeBtnHtml = canCancel
    ? `<button class="modal-close-btn" id="settingsCloseBtn" style="position:absolute;top:14px;right:14px" title="Back">&times;</button>`
    : "";
  app.innerHTML = `
    <div class="center-box" style="position:relative">
      ${closeBtnHtml}
      <h2>Setup</h2>
      <p style="color:var(--muted);font-size:0.85rem">
        These are stored only in this browser's local storage - never written
        into this HTML file, so it's safe to keep this file in a public repo.
      </p>
      <label>SIMKL Client ID
        (<a href="https://simkl.com/settings/developer/" target="_blank">create an app</a>)</label>
      <input type="text" id="clientIdInput" value="${cfg.clientId}">
      <label>TMDB API Key
        (<a href="https://www.themoviedb.org/settings/api" target="_blank">get a free key</a>)</label>
      <input type="text" id="tmdbKeyInput" value="${cfg.tmdbKey}">

  document.getElementById("saveSettingsBtn").onclick = () => {

    if (!clientId || !tmdbKey) {
      document.getElementById("settingsError").textContent = "Both fields are required.";
      return;
    }
    localStorage.setItem(LS_CLIENT_ID, clientId);
    localStorage.setItem(LS_TMDB_KEY, tmdbKey);
